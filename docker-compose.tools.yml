# =============================================================
# docker-compose.tools.yml - Herramientas opcionales (Portainer & SonarQube)
#
# No se levantan por defecto. Lánzalo junto al compose principal:
#   docker compose -f docker-compose.yml -f docker-compose.tools.yml up -d
# O solo las herramientas (sin levantar la app):
#   docker compose -f docker-compose.tools.yml up -d
#
# Acceso UI:
#   Portainer: http://localhost:19100 (configurable via PORTAINER_PORT)
#   SonarQube: http://localhost:9000  (configurable via SONARQUBE_PORT / SONAR_PORT)
# =============================================================

services:

  portainer:
    image: portainer/portainer-ce:latest
    container_name: portainer
    restart: unless-stopped
    ports:
      - "${PORTAINER_PORT:-19100}:9000"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - portainer_data:/data

  sonarqube:
    image: sonarqube:community
    container_name: sonarqube
    restart: unless-stopped
    ports:
      - "${SONARQUBE_PORT:-${SONAR_PORT:-9000}}:9000"
    environment:
      - SONAR_ES_BOOTSTRAP_CHECKS_DISABLE=true
    volumes:
      - sonarqube_data:/opt/sonarqube/data
      - sonarqube_extensions:/opt/sonarqube/extensions
      - sonarqube_logs:/opt/sonarqube/logs

volumes:
  portainer_data:
    driver: local
  sonarqube_data:
    driver: local
  sonarqube_extensions:
    driver: local
  sonarqube_logs:
    driver: local
